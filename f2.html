<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小菜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #1d1815;
      --broth: #3a2516;
      --paper: #efe3c8;
      --noren: #a4262c;
      --yolk: #e9a33b;
      --serif: "Noto Serif TC", "Songti TC", serif;
      --sans: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--night);
      color: var(--paper);
      font-family: var(--sans);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .noren {
      position: relative;
      background: var(--noren);
      height: 150px;
      overflow: hidden;
      transform-origin: top center;
      animation: drop 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    .noren::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 18px;
      background: var(--paper);
      opacity: .92;
    }
    .noren-text {
      position: absolute;
      left: 50%;
      top: 44px;
      transform: translateX(-50%);
      writing-mode: vertical-rl;
      font-family: var(--serif);
      font-weight: 900;
      font-size: 2.1rem;
      letter-spacing: .4em;
      color: var(--paper);
    }
    @keyframes drop {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 64px;
      display: grid;
      gap: 16px;
    }
    .item {
      display: grid;
      grid-template-columns: 300px 1fr;
      align-items: center;
      gap: 24px;
      padding: 16px;
      background: var(--broth);
      border-left: 6px solid var(--noren);
      border-radius: 4px;
      transition: border-color .2s ease;
    }
    .item:hover { border-left-color: var(--yolk); }
    .item img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      border-radius: 2px;
    }
    .item-name {
      font-family: var(--serif);
      font-weight: 900;
      font-size: 1.6rem;
      letter-spacing: .12em;
    }
    @media (max-width: 620px) {
      .item { grid-template-columns: 1fr; }
      .noren-text { font-size: 1.7rem; top: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .noren { animation: none; }
      .item { transition: none; }
    }
  </style>
</head>
<body>
  <div class="noren" aria-hidden="true">
    <span class="noren-text">小菜</span>
  </div>
  <main class="wrap">
    <article class="item">
      <img src="2-1.jpg" alt="白飯">
      <h2 class="item-name">白飯</h2>
    </article>
    <article class="item">
      <img src="2-2.png" alt="味玉">
      <h2 class="item-name">味玉</h2>
    </article>
    <article class="item">
      <img src="2-3.jpg" alt="叉燒">
      <h2 class="item-name">叉燒</h2>
    </article>
  </main>
</body>
</html>
